<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея бійців</title>
<style>
  :root{--bg:#0b0e14;--panel:#121826;--line:#26324a;--text:#dfe6f3;--dim:#8b95a8;--gold:#f4c430}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px "Segoe UI",system-ui,sans-serif;padding:14px}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:20px;color:var(--gold);margin-right:10px}
  select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
  button.on{border-color:var(--gold);color:var(--gold)}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px}
  .row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  #live{background:radial-gradient(circle at 50% 40%,#232c3e,#10141c);border:1px solid var(--line);border-radius:8px}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720" style="display:none"></canvas>
<header>
  <h1>🎨 Галерея бійців</h1>
  <select id="selCls"></select>
  <select id="selSpec"></select>
  <select id="selSkin"></select>
  <button id="bSheet" class="on">Спрайт-шит</button>
  <button id="bAll">Усі скіни</button>
  <button id="bParts">Анатомія</button>
  <button id="bProc" title="Процедурна модель замість растрових деталей — для порівняння (?cutout=off)">Процедурний</button>
  <button id="bForm"></button>
</header>
<div class="row">
  <div>
    <canvas id="sheet"></canvas>
    <div class="hint">Кадри розраховуються тим самим ригом, що й у бою. Масштаб ×3, піксель-арт без згладжування.</div>
  </div>
  <canvas id="live" width="120" height="120" style="width:360px;height:360px"></canvas>
</div>
<script src="js/arenas_data.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/rig.js"></script>
<script src="js/paint.js"></script>
<script src="js/cutout.js"></script>
<script src="js/cat.js"></script>
<script src="js/models.js"></script>
<script src="js/sprite.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
